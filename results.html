<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results | APEX Institute OF Education</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/pw/AP1GczOg65fvBOxhQFfWkhr9enxOp6QSg_iV4iO1rTSMGen05bBwHKLywS7MFpPdhvHiTlWAYrKu4XHfbCydNTHp_-NqxTu0lYcBM0d9lhVdLQ9FXYEiGoIaK9iBO8EgMKbHbAg7J82Cd7AkFqOQeApdmMiz=w913-h913-s-no-gm">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fffbeb54; --primary-grad: linear-gradient(135deg, #FF3B30 0%, #FF9500 100%);
            --bg-grad: linear-gradient(135deg, #fffbeb 0%, #fefce8 100%);
            --orange: #FF9500; --dark: #1C1C1E; --slate: #3A3A3C; --white: #E5E5EA;
            --card-bg: rgba(255, 255, 255, 0.7); --nav-bg: rgba(255, 255, 255, 0.55); --nav-border: rgba(255, 255, 255, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; text-decoration: none !important; }
        body { color: var(--dark); min-height: 100vh; background-color: var(--bg-color); background-image: var(--bg-grad), url('https://i.ibb.co/k7XV5kD/e5a3b600681fd79ebb5446e942459334.jpg?auto=format&fit=crop'); background-size: cover; background-position: center; }
        nav.navbar { background: var(--nav-bg); backdrop-filter: blur(24px); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 20px; z-index: 1000; border: 1px solid var(--nav-border); border-radius: 50px; width: 90%; max-width: 1200px; margin: 20px auto; }
        .nav-links { display: flex; gap: 32px; list-style: none; align-items: center; }
        .nav-links a { color: var(--slate); font-weight: 700; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--orange); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; }
        .card { background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 24px; border: 1px solid var(--nav-border); padding: 25px; text-align: center; }
        .result-badge { background: var(--orange); color: white; padding: 6px 16px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; display: inline-block; margin-top: 8px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="https://lh3.googleusercontent.com/pw/AP1GczOg65fvBOxhQFfWkhr9enxOp6QSg_iV4iO1rTSMGen05bBwHKLywS7MFpPdhvHiTlWAYrKu4XHfbCydNTHp_-NqxTu0lYcBM0d9lhVdLQ9FXYEiGoIaK9iBO8EgMKbHbAg7J82Cd7AkFqOQeApdmMiz=w913-h913-s-no-gm" style="width:45px;height:45px;border-radius:50%;">
        </div>
        <div style="font-size: 1.4rem; font-weight: 800;">APEX<span style="color: var(--orange);">IOE</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="classes.html">All Classes</a></li>
            <li><a href="instructors.html">Instructors</a></li>
            <li><a href="results.html" class="active">Results</a></li>
        </ul>
    </nav>

    <div style="padding: 60px 10%;">
        <h2 style="font-size: 2.5rem; font-weight: 800; text-align: center; margin-bottom: 40px;">Student <span style="color: var(--orange)">Results & Achievements</span></h2>
        <div class="grid" id="results-grid"></div>
    </div>

    <script>
        // Pulls directly from the 'Results' tab in your Google Sheet
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSY4iju1X2pOZN8htcYUKqmOKJv14r52kHEKwGTWJKh5lrmaV265qN1ku7icdqdlhFgAIju78Ly7JMs/pub?output=csv&sheet=Results';

        async function loadResults() {
            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const lines = text.trim().split(/\r?\n/);
                let html = '';
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.replace(/^"\vert{}"$/g, '').trim());
                    html += `
                        <div class="card">
                            <div style="width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; margin-bottom: 15px;">
                                <img src="${cols[4]}" style="width: 100%; height: 100%; object-fit: cover;" alt="${cols[0]}">
                            </div>
                            <h3 style="font-size: 1.2rem;">${cols[0]}</h3>
                            <p style="color: var(--slate); font-size: 0.9rem; margin-top: 4px;">${cols[1]} (${cols[2]})</p>
                            <span class="result-badge">${cols[3]}</span>
                        </div>
                    `;
                }
                document.getElementById('results-grid').innerHTML = html;
            } catch(e) {
                document.getElementById('results-grid').innerHTML = '<p style="text-align:center;">Add a "Results" tab in your Google Sheet to display achievements here.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
